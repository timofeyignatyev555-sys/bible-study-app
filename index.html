<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bible Study">
<meta name="description" content="Roster, calendar, attendance and hosting rotation for a weekly Bible study.">
<title>Bible Study</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1 id="appName">Bible Study</h1><div class="sub"><span class="dot" id="syncDot"></span><span id="syncText">local</span></div></div>
    <div class="right" id="topRight"></div>
  </header>

  <div id="connect" class="connect hidden">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v16h5.5a2.5 2.5 0 0 1 2.5 2z"/></svg></div>
    <div><h2>Connect this device</h2><p class="muted" style="margin-top:6px">Open your setup link on this phone or laptop, or paste the sync token. Your roster and schedule are stored privately and stay in sync between devices.</p></div>
    <div class="field"><label for="tokenIn">Sync token</label><input id="tokenIn" type="password" autocomplete="off" placeholder="paste token"></div>
    <div class="err hidden" id="tokenErr"></div>
    <div class="btn-row"><button class="btn primary" id="tokenGo">Connect</button></div>
    <details class="adv"><summary>Use without sync</summary><p class="dim" style="margin:6px 0 10px">Everything stays in this browser only. You can connect later from Settings.</p><button class="btn" id="startLocal">Start on this device only</button></details>
  </div>

  <main id="app" class="hidden">
    <div id="p-week" class="panel on"></div>
    <div id="p-calendar" class="panel"></div>
    <div id="p-people" class="panel"></div>
    <div id="p-hosting" class="panel"></div>
    <div id="p-settings" class="panel"></div>
  </main>
</div>

<nav class="tabbar hidden" id="tabbar" role="tablist">
  <button role="tab" data-tab="week" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M8 14h3"/></svg><span>This week</span></button>
  <button role="tab" data-tab="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2"/></svg><span>Calendar</span></button>
  <button role="tab" data-tab="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.5a5 5 0 0 1 6 5"/></svg><span>People</span></button>
  <button role="tab" data-tab="hosting"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span>Hosting</span></button>
  <button role="tab" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="head"><h2 id="sheetTitle"></h2><button class="btn sm ghost" id="sheetClose">Close</button></div>
  <div class="body" id="sheetBody"></div>
  <div class="foot hidden" id="sheetFoot"></div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
